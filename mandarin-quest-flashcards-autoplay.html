<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandarin Quest Flashcards</title>
  <style>
    :root{
      --ink:#18324a; --muted:#65758a; --paper:#fffdf8; --line:#e7e2d8;
      --accent:#e89a3d; --accent2:#f6d59d; --soft:#f7f2e8; --good:#e8f4ea;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
      color:var(--ink); background:#f3efe7;
    }
    .shell{max-width:900px;margin:auto;padding:28px 18px 48px}
    header{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:24px}
    .brand{font-weight:800;letter-spacing:.02em;font-size:1.15rem}
    .brand span{color:var(--accent)}
    .settings{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    button,select{
      font:inherit;border:1px solid var(--line);background:white;color:var(--ink);
      border-radius:999px;padding:9px 13px;cursor:pointer;
    }
    button:hover{border-color:#cfc7b8}
    button.active{background:var(--ink);color:white;border-color:var(--ink)}
    .intro{margin-bottom:18px}
    h1{font-size:clamp(1.6rem,4vw,2.5rem);margin:0 0 6px}
    .subtitle{color:var(--muted);margin:0}
    .progress-wrap{display:flex;align-items:center;gap:12px;margin:20px 0 12px}
    .progress{height:8px;background:#ded8cc;border-radius:999px;overflow:hidden;flex:1}
    .bar{height:100%;background:var(--accent);width:0%;transition:.25s}
    .count{font-size:.9rem;color:var(--muted);min-width:56px;text-align:right}
    .card{
      min-height:390px;background:var(--paper);border:1px solid var(--line);
      border-radius:28px;box-shadow:0 12px 35px rgba(41,50,58,.08);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      text-align:center;padding:38px 24px;position:relative;user-select:none;
    }
    .type{
      position:absolute;top:20px;left:22px;font-size:.78rem;font-weight:700;
      letter-spacing:.08em;text-transform:uppercase;color:var(--muted)
    }
    .visual{font-size:clamp(4rem,14vw,7rem);line-height:1;margin-bottom:20px}
    .hanzi{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;font-size:clamp(3rem,11vw,6rem);font-weight:750;line-height:1.15}
    .pinyin{font-size:1.35rem;color:var(--accent);margin-top:10px}
    .english{font-size:1.25rem;color:var(--muted);margin-top:8px}
    .hint{font-size:.92rem;color:var(--muted);margin-top:22px}
    .audio{
      position:absolute;right:20px;top:18px;width:48px;height:48px;padding:0;
      display:grid;place-items:center;font-size:1.35rem;background:var(--soft)
    }
    .controls{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;margin-top:14px}
    .controls button{border-radius:14px;padding:13px 16px;font-weight:700}
    .flip{background:var(--ink);color:white;border-color:var(--ink);min-width:145px}
    .rating{display:flex;gap:10px;justify-content:center;margin-top:12px}
    .rating button{border-radius:14px;padding:11px 16px}
    .again{background:#fff7e8}.know{background:var(--good)}
    .footer-note{text-align:center;color:var(--muted);font-size:.85rem;margin-top:22px}
    .start-overlay{
      position:fixed;inset:0;background:rgba(24,50,74,.72);display:grid;
      place-items:center;padding:20px;z-index:20;
    }
    .start-box{
      width:min(430px,100%);background:var(--paper);border-radius:28px;padding:34px;
      text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.18);
    }
    .start-box h2{margin:0 0 8px;font-size:1.8rem}
    .start-box p{color:var(--muted);line-height:1.5;margin:0 0 22px}
    .start-box button{
      background:var(--ink);color:white;border-color:var(--ink);
      border-radius:16px;padding:14px 24px;font-weight:800;font-size:1.05rem;
    }
    @media(max-width:600px){
      header{align-items:flex-start;flex-direction:column}.settings{justify-content:flex-start}
      .card{min-height:360px}.controls{grid-template-columns:1fr 1fr}
      .flip{grid-column:1/-1;grid-row:1}.prev{grid-row:2}.next{grid-row:2}
    }
  </style>
</head>
<body>
<div class="start-overlay" id="startOverlay">
  <div class="start-box">
    <h2>Ready for Mandarin?</h2>
    <p>Look at each card and try to say it. Tap 🔊 whenever you want to hear the Mandarin.</p>
    <button id="startBtn">▶ Start Flashcards</button>
  </div>
</div>
<div class="shell">
  <div style="margin-bottom:10px"><a id="lessonBack" href="student.html?week=1" style="font-weight:800;color:#18324a;text-decoration:none">← Back to My Lesson</a></div>
  <header>
    <div class="brand">MANDARIN <span>QUEST</span></div>
    <div class="settings">
      <select id="weekSelect" aria-label="Choose week"></select>
      <select id="modeSelect" aria-label="Choose practice mode">
        <option value="week">This Week</option>
        <option value="review">Review Everything</option>
      </select>
      <button id="scriptBtn" title="Switch between Simplified and Traditional">简体</button>
      <button id="pinyinBtn">Pinyin: Off</button>
      <button id="englishBtn">English: Off</button>
    </div>
  </header>

  <section class="intro">
    <h1 id="weekTitle">Week 1 Flashcards</h1>
    <p class="subtitle" id="weekGoal"></p>
  </section>

  <div class="progress-wrap">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="count" id="count"></div>
  </div>

  <main class="card" id="card" tabindex="0" aria-label="Flashcard. Click to flip.">
    <div class="type" id="type"></div>
    <button class="audio" id="audioBtn" aria-label="Play Mandarin audio">🔊</button>
    <div class="visual" id="visual"></div>
    <div class="hanzi" id="hanzi"></div>
    <div class="pinyin" id="pinyin"></div>
    <div class="english" id="english"></div>
    <div class="hint" id="hint">Tap the card to reveal the meaning</div>
  </main>

  <div class="controls">
    <button class="prev" id="prevBtn">← Back</button>
    <button class="flip" id="flipBtn">Flip Card</button>
    <button class="next" id="nextBtn">Next →</button>
  </div>

  <div class="rating">
    <button class="again" id="againBtn">↻ Practice again</button>
    <button class="know" id="knowBtn">✓ I know it</button>
  </div>

  <div class="footer-note">Try to remember it first. Tap 🔊 if you need help, then flip the card.</div>
</div>

<script>
/*
  ADD NEW WEEKS HERE.
  Each card can store both scripts even if they are identical.
  "front" is the child-facing Mandarin target.
*/
const course = {
  1: {
    title: "Week 1 · Names",
    goal: "Say hello, ask someone's name, and tell your name.",
    cards: [
      {type:"Greeting", s:"你好", t:"你好", p:"nǐ hǎo", e:"hello", icon:"👋"},
      {type:"Word", s:"我", t:"我", p:"wǒ", e:"I / me", icon:"🙋"},
      {type:"Word", s:"你", t:"你", p:"nǐ", e:"you", icon:"👉"},
      {type:"Word", s:"叫", t:"叫", p:"jiào", e:"to be called", icon:"💬"},
      {type:"Question", s:"你叫什么名字？", t:"你叫什麼名字？", p:"nǐ jiào shénme míngzi?", e:"What's your name?", icon:"❓"},
      {type:"Answer", s:"我叫___。", t:"我叫___。", p:"wǒ jiào ___.", e:"My name is ___.", icon:"🙂"},
      {type:"Goodbye", s:"再见", t:"再見", p:"zàijiàn", e:"goodbye", icon:"👋"}
    ]
  },
  2: {
    title: "Week 2 · Numbers",
    goal: "Count from 1–10 and ask how many.",
    cards: [
      {type:"Number",s:"一",t:"一",p:"yī",e:"one",icon:"1️⃣"},
      {type:"Number",s:"二",t:"二",p:"èr",e:"two",icon:"2️⃣"},
      {type:"Number",s:"三",t:"三",p:"sān",e:"three",icon:"3️⃣"},
      {type:"Number",s:"四",t:"四",p:"sì",e:"four",icon:"4️⃣"},
      {type:"Number",s:"五",t:"五",p:"wǔ",e:"five",icon:"5️⃣"},
      {type:"Number",s:"六",t:"六",p:"liù",e:"six",icon:"6️⃣"},
      {type:"Number",s:"七",t:"七",p:"qī",e:"seven",icon:"7️⃣"},
      {type:"Number",s:"八",t:"八",p:"bā",e:"eight",icon:"8️⃣"},
      {type:"Number",s:"九",t:"九",p:"jiǔ",e:"nine",icon:"9️⃣"},
      {type:"Number",s:"十",t:"十",p:"shí",e:"ten",icon:"🔟"},
      {type:"Question",s:"几个？",t:"幾個？",p:"jǐ ge?",e:"how many?",icon:"❓"},
      {type:"Question",s:"有几个？",t:"有幾個？",p:"yǒu jǐ ge?",e:"How many are there?",icon:"🔢"}
    ]
  },
  3: {
    title: "Week 3 · Animals",
    goal: "Name animals and say what something is or isn't.",
    cards: [
      {type:"Animal",s:"猫",t:"貓",p:"māo",e:"cat",icon:"🐱"},
      {type:"Animal",s:"狗",t:"狗",p:"gǒu",e:"dog",icon:"🐶"},
      {type:"Animal",s:"鸟",t:"鳥",p:"niǎo",e:"bird",icon:"🐦"},
      {type:"Animal",s:"兔子",t:"兔子",p:"tùzi",e:"rabbit",icon:"🐰"},
      {type:"Animal",s:"鱼",t:"魚",p:"yú",e:"fish",icon:"🐟"},
      {type:"Animal",s:"乌龟",t:"烏龜",p:"wūguī",e:"turtle",icon:"🐢"},
      {type:"Word",s:"是",t:"是",p:"shì",e:"is / am / are",icon:"✓"},
      {type:"Word",s:"不是",t:"不是",p:"bú shì",e:"is not / am not / are not",icon:"✗"},
      {type:"Question",s:"这是什么？",t:"這是什麼？",p:"zhè shì shénme?",e:"What is this?",icon:"❓"},
      {type:"Sentence",s:"这是猫。",t:"這是貓。",p:"zhè shì māo.",e:"This is a cat.",icon:"🐱"}
    ]
  },
  4: {
    title: "Week 4 · How Old?",
    goal: "Ask someone's age and tell your age.",
    cards: [
      {type:"Word",s:"岁",t:"歲",p:"suì",e:"years old",icon:"🎂"},
      {type:"Question",s:"几岁？",t:"幾歲？",p:"jǐ suì?",e:"how old?",icon:"🎈"},
      {type:"Question",s:"你几岁？",t:"你幾歲？",p:"nǐ jǐ suì?",e:"How old are you?",icon:"❓"},
      {type:"Answer",s:"我五岁。",t:"我五歲。",p:"wǒ wǔ suì.",e:"I'm five years old.",icon:"5️⃣"},
      {type:"Answer",s:"我六岁。",t:"我六歲。",p:"wǒ liù suì.",e:"I'm six years old.",icon:"6️⃣"},
      {type:"Answer",s:"我七岁。",t:"我七歲。",p:"wǒ qī suì.",e:"I'm seven years old.",icon:"7️⃣"},
      {type:"Answer",s:"我八岁。",t:"我八歲。",p:"wǒ bā suì.",e:"I'm eight years old.",icon:"8️⃣"},
      {type:"Mini intro",s:"我叫___。我___岁。",t:"我叫___。我___歲。",p:"wǒ jiào ___. wǒ ___ suì.",e:"My name is ___. I'm ___ years old.",icon:"🙂"}
    ]
  },
  5: {
    title: "Week 5 · Colors",
    goal: "Name red, yellow, and blue and ask what color something is.",
    cards: [
      {type:"Color",s:"红色",t:"紅色",p:"hóngsè",e:"red",icon:"🔴"},
      {type:"Color",s:"黄色",t:"黃色",p:"huángsè",e:"yellow",icon:"🟡"},
      {type:"Color",s:"蓝色",t:"藍色",p:"lánsè",e:"blue",icon:"🔵"},
      {type:"Word",s:"颜色",t:"顏色",p:"yánsè",e:"color",icon:"🎨"},
      {type:"Question",s:"什么颜色？",t:"什麼顏色？",p:"shénme yánsè?",e:"What color?",icon:"❓"},
      {type:"Sentence",s:"红色的猫",t:"紅色的貓",p:"hóngsè de māo",e:"a red cat",icon:"🐱"},
      {type:"Sentence",s:"蓝色的鸟",t:"藍色的鳥",p:"lánsè de niǎo",e:"a blue bird",icon:"🐦"}
    ]
  },
  6: {
    title: "Week 6 · More Colors",
    goal: "Add more colors and use them to describe familiar things.",
    cards: [
      {type:"Color",s:"绿色",t:"綠色",p:"lǜsè",e:"green",icon:"🟢"},
      {type:"Color",s:"紫色",t:"紫色",p:"zǐsè",e:"purple",icon:"🟣"},
      {type:"Color",s:"橙色",t:"橙色",p:"chéngsè",e:"orange",icon:"🟠"},
      {type:"Color",s:"粉色",t:"粉色",p:"fěnsè",e:"pink",icon:"🌸"},
      {type:"Color",s:"黑色",t:"黑色",p:"hēisè",e:"black",icon:"⚫"},
      {type:"Color",s:"白色",t:"白色",p:"báisè",e:"white",icon:"⚪"},
      {type:"Color",s:"灰色",t:"灰色",p:"huīsè",e:"gray",icon:"🌫️"},
      {type:"Color",s:"棕色",t:"棕色",p:"zōngsè",e:"brown",icon:"🟤"},
      {type:"Question",s:"它是什么颜色？",t:"它是什麼顏色？",p:"tā shì shénme yánsè?",e:"What color is it?",icon:"❓"}
    ]
  },
  7: {
    title: "Week 7 · How Are You? & Likes",
    goal: "Ask how someone is and talk about favorite colors.",
    cards: [
      {type:"Question",s:"你好吗？",t:"你好嗎？",p:"nǐ hǎo ma?",e:"How are you?",icon:"🙂"},
      {type:"Answer",s:"我很好。",t:"我很好。",p:"wǒ hěn hǎo.",e:"I'm very well.",icon:"😊"},
      {type:"Question",s:"好不好？",t:"好不好？",p:"hǎo bu hǎo?",e:"Is it good? / Okay?",icon:"👍"},
      {type:"Word",s:"喜欢",t:"喜歡",p:"xǐhuan",e:"to like",icon:"❤️"},
      {type:"Word",s:"不喜欢",t:"不喜歡",p:"bù xǐhuan",e:"don't like",icon:"💔"},
      {type:"Question",s:"你喜欢什么颜色？",t:"你喜歡什麼顏色？",p:"nǐ xǐhuan shénme yánsè?",e:"What color do you like?",icon:"🎨"},
      {type:"Answer",s:"我喜欢蓝色。",t:"我喜歡藍色。",p:"wǒ xǐhuan lánsè.",e:"I like blue.",icon:"🔵"},
      {type:"Word",s:"他",t:"他",p:"tā",e:"he / him",icon:"👦"},
      {type:"Word",s:"她",t:"她",p:"tā",e:"she / her",icon:"👧"}
    ]
  },
  8: {
    title: "Week 8 · All About Me",
    goal: "Put names, age, colors, animals, and likes together.",
    cards: [
      {type:"Question",s:"你叫什么名字？",t:"你叫什麼名字？",p:"nǐ jiào shénme míngzi?",e:"What's your name?",icon:"❓"},
      {type:"Answer",s:"我叫___。",t:"我叫___。",p:"wǒ jiào ___.",e:"My name is ___.",icon:"🙂"},
      {type:"Question",s:"你几岁？",t:"你幾歲？",p:"nǐ jǐ suì?",e:"How old are you?",icon:"🎂"},
      {type:"Answer",s:"我___岁。",t:"我___歲。",p:"wǒ ___ suì.",e:"I'm ___ years old.",icon:"🎈"},
      {type:"Question",s:"你喜欢什么颜色？",t:"你喜歡什麼顏色？",p:"nǐ xǐhuan shénme yánsè?",e:"What color do you like?",icon:"🎨"},
      {type:"Answer",s:"我喜欢___色。",t:"我喜歡___色。",p:"wǒ xǐhuan ___ sè.",e:"I like ___.",icon:"❤️"},
      {type:"Question",s:"这是什么？",t:"這是什麼？",p:"zhè shì shénme?",e:"What is this?",icon:"❓"},
      {type:"Sentence",s:"这是兔子。",t:"這是兔子。",p:"zhè shì tùzi.",e:"This is a rabbit.",icon:"🐰"},
      {type:"Question",s:"有几个？",t:"有幾個？",p:"yǒu jǐ ge?",e:"How many are there?",icon:"🔢"},
      {type:"Mini intro",s:"你好！我叫___。我___岁。",t:"你好！我叫___。我___歲。",p:"nǐ hǎo! wǒ jiào ___. wǒ ___ suì.",e:"Hello! My name is ___. I'm ___ years old.",icon:"👋"}
    ]
  }
};

let week = Math.min(8, Math.max(1, Number(new URLSearchParams(location.search).get("week")) || 1)), index = 0, flipped = false;
let traditional = false, showPinyin = false, showEnglish = false;
let practiceAgain = [];
let audioUnlocked = false;
let mode = "week";
let reviewCards = [];

function buildReviewCards(){
  reviewCards = [];
  for(let w=1; w<=week; w++){
    course[w].cards.forEach(c => reviewCards.push(c));
  }
  // Shuffle cumulative review so retrieval is mixed.
  for(let i=reviewCards.length-1; i>0; i--){
    const j=Math.floor(Math.random()*(i+1));
    [reviewCards[i],reviewCards[j]]=[reviewCards[j],reviewCards[i]];
  }
}
function activeCards(){
  return mode === "review" ? reviewCards : course[week].cards;
}

const $ = id => document.getElementById(id);
const weekSelect = $("weekSelect");

Object.keys(course).forEach(w => {
  const opt = document.createElement("option");
  opt.value = w; opt.textContent = course[w].title;
  weekSelect.appendChild(opt);
});

function currentCard(){ return activeCards()[index]; }

function render(){
  const set = course[week], c = currentCard(), cards = activeCards();
  $("weekTitle").textContent = mode === "review" ? `Review Through ${set.title}` : set.title + " Flashcards";
  $("weekGoal").textContent = mode === "review" ? `Mixed review from Weeks 1–${week}.` : set.goal;
  $("type").textContent = c.type;
  $("visual").textContent = c.icon || "";
  $("hanzi").textContent = traditional ? c.t : c.s;
  $("pinyin").textContent = (showPinyin || flipped) ? c.p : "";
  $("english").textContent = (showEnglish || flipped) ? c.e : "";
  $("hint").textContent = flipped ? "Say it one more time before moving on." : "Tap the card to reveal the meaning";
  $("count").textContent = `${index+1} / ${cards.length}`;
  $("bar").style.width = `${((index+1)/cards.length)*100}%`;
  $("scriptBtn").textContent = traditional ? "繁體" : "简体";
  $("pinyinBtn").textContent = `Pinyin: ${showPinyin ? "On" : "Off"}`;
  $("englishBtn").textContent = `English: ${showEnglish ? "On" : "Off"}`;
  $("pinyinBtn").classList.toggle("active", showPinyin);
  $("englishBtn").classList.toggle("active", showEnglish);
}

function speak(){
  const c = currentCard();
  if(!("speechSynthesis" in window)){
    alert("Audio isn't supported in this browser.");
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(c.s.replace("___",""));
  u.lang = "zh-CN"; u.rate = 0.78;
  const voices = speechSynthesis.getVoices();
  const zh = voices.find(v => /^zh(-|_)?CN/i.test(v.lang)) || voices.find(v => /^zh/i.test(v.lang));
  if(zh) u.voice = zh;
  speechSynthesis.speak(u);
}

function move(delta){
  const n = activeCards().length;
  index = (index + delta + n) % n;
  flipped = false;
  render();
  
}
function flip(){ flipped = !flipped; render(); }

$("audioBtn").addEventListener("click", e => {e.stopPropagation(); speak();});
$("card").addEventListener("click", flip);
$("flipBtn").addEventListener("click", flip);
$("prevBtn").addEventListener("click", ()=>move(-1));
$("nextBtn").addEventListener("click", ()=>move(1));
$("scriptBtn").addEventListener("click", ()=>{traditional=!traditional;render();});
$("pinyinBtn").addEventListener("click", ()=>{showPinyin=!showPinyin;render();});
$("englishBtn").addEventListener("click", ()=>{showEnglish=!showEnglish;render();});
$("againBtn").addEventListener("click", ()=>{
  practiceAgain.push({...currentCard()}); move(1);
});
$("knowBtn").addEventListener("click", ()=>move(1));
weekSelect.addEventListener("change", e=>{
  week=Number(e.target.value);
  $("lessonBack").href = "student.html?week=" + week;
  history.replaceState(null,"",location.pathname+"?week="+week);
  index=0;
  flipped=false;
  if(mode === "review") buildReviewCards();
  render();
  
});
$("modeSelect").addEventListener("change", e=>{
  mode=e.target.value;
  index=0;
  flipped=false;
  if(mode === "review") buildReviewCards();
  render();
  
});
$("startBtn").addEventListener("click", ()=>{
  audioUnlocked = true;
  $("startOverlay").style.display = "none";
  speak();
});

document.addEventListener("keydown", e=>{
  if(e.key==="ArrowRight") move(1);
  if(e.key==="ArrowLeft") move(-1);
  if(e.key===" "){e.preventDefault();flip();}
  if(e.key.toLowerCase()==="a") speak();
});
weekSelect.value = String(week);
$("lessonBack").href = "student.html?week=" + week;
buildReviewCards();
render();
</script>
</body>
</html>
